name: Sync fork with upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main 

      - name: Add upstream remote
        run: git remote add upstream https://github.com/tarboh/S-MU2000.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Attempt merge
        id: merge
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit

      - name: Push changes
        if: steps.merge.outcome == 'success'
        run: git push origin main

      - name: Abort failed merge
        if: steps.merge.outcome == 'failure'
        run: git merge --abort

      - name: Open issue on conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream sync failed: merge conflict',
                body: `The automatic sync from [tarboh/S-MU2000](https://github.com/tarboh/S-MU2000) failed due to a merge conflict.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTo fix manually:\n\`\`\`\ngit fetch upstream\ngit merge upstream/main\n# resolve conflicts\ngit push origin main\n\`\`\``,
                labels: ['sync-conflict']
              });
            }
