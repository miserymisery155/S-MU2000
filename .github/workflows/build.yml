name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync fork with upstream"]
    types: [completed]

jobs:
  build-windows:
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            python

      - name: Build all targets (including VST3 and CLAP)
        run: make -j$(nproc) all

      - name: Zip Windows build
        run: |
          mkdir -p dist
          cd build
          7z a -tzip ../dist/S-MU2000-windows.zip \
            *.exe \
            S-MU2000.vst3 \
            S-MU2000.clap

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-MU2000-windows
          path: dist/S-MU2000-windows.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Build all targets (verify/boot/render/live/gui, VST3, AU)
        run: make -j$(sysctl -n hw.ncpu) all

      - name: Build CLAP
        run: make -j$(sysctl -n hw.ncpu) clap

      - name: Build AUv3 (ad-hoc signed)
        run: make -j$(sysctl -n hw.ncpu) auv3 CODESIGN_ID=-

      - name: Zip macOS build
        run: |
          mkdir -p dist
          cd build
          zip -r -y ../dist/S-MU2000-macos.zip \
            verify boot render live gui statetest blocktime \
            S-MU2000.vst3 \
            S-MU2000.component \
            S-MU2000.clap \
            S-MU2000.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-MU2000-macos
          path: dist/S-MU2000-macos.zip
          if-no-files-found: error
