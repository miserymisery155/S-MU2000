name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync fork with upstream"]
    types: [completed]

jobs:
  build-windows:
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            python
            zip

      - name: Build all targets (including VST3 and CLAP)
        run: make -j$(nproc) all

      - name: Stage Windows build
        run: |
          mkdir -p dist/S-MU2000-windows
          cd build
          cp *.exe ../dist/S-MU2000-windows/
          cp -r S-MU2000.vst3 ../dist/S-MU2000-windows/
          cp -r S-MU2000.clap ../dist/S-MU2000-windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-MU2000-windows
          path: dist/S-MU2000-windows
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Build all targets (verify/boot/render/live/gui, VST3, AU)
        run: make -j$(sysctl -n hw.ncpu) all

      - name: Build CLAP
        run: make -j$(sysctl -n hw.ncpu) clap

      - name: Build AUv3 (ad-hoc signed, no ROMs baked in)
        run: make -j$(sysctl -n hw.ncpu) auv3 CODESIGN_ID=- AUV3_ROMS=none

      - name: Stage macOS build
        run: |
          mkdir -p dist/S-MU2000-macos
          cd build
          cp verify boot render live gui statetest blocktime vst3probe aubprobe ../dist/S-MU2000-macos/
          cp -r S-MU2000.vst3 ../dist/S-MU2000-macos/
          cp -r S-MU2000.component ../dist/S-MU2000-macos/
          cp -r S-MU2000.clap ../dist/S-MU2000-macos/
          cp -r S-MU2000.app ../dist/S-MU2000-macos/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-MU2000-macos
          path: dist/S-MU2000-macos
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      SDL3_VERSION: "3.4.16"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Install apt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcairo2-dev cmake ninja-build \
            libdecor-0-dev libdrm-dev libgbm-dev libgl-dev libpulse-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev

      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL3_VERSION }}-${{ runner.os }}

      - name: Build SDL3 from source
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --branch release-${SDL3_VERSION} --depth 1 https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build sdl3-build
          sudo cmake --install sdl3-build

      - name: Install cached SDL3
        if: steps.cache-sdl3.outputs.cache-hit == 'true'
        run: sudo cp -r /opt/sdl3/. /usr/local/

      - name: Point pkg-config / compiler at SDL3
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=/usr/local/include:${CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/usr/local/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build all targets (verify/boot/render/live/gui, VST3, CLAP)
        run: make -j$(nproc) all

      - name: Stage Linux build
        run: |
          mkdir -p dist/S-MU2000-linux
          cd build-linux
          cp verify boot render live gui panel statetest blocktime vst3probe clapprobe ../dist/S-MU2000-linux/
          cp -r S-MU2000.vst3 ../dist/S-MU2000-linux/
          cp -r S-MU2000.clap ../dist/S-MU2000-linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-MU2000-linux
          path: dist/S-MU2000-linux
          if-no-files-found: error
